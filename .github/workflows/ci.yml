name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The Wails desktop app (cmd/which-model-desktop) needs GTK/webkitgtk
      # to compile on Linux, so it is NOT built here; the desktop-backend job
      # below builds it on macOS. The CLI and its libraries are verified here.
      - run: go build ./cmd/which-model ./internal/... ./pkg/...
      - run: go vet ./cmd/which-model ./internal/... ./pkg/...
      - run: go test ./cmd/which-model ./internal/... ./pkg/...
      - name: nousage audit (build matrix + strings scan)
        if: hashFiles('scripts/audit-nousage.sh') != ''
        run: bash scripts/audit-nousage.sh

  npm-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Smoke-test npm packaging
        run: bash scripts/smoke-npm.sh npm

  desktop-backend:
    # The Wails desktop backend needs CGO + the GTK/webkitgtk toolchain on
    # Linux; macOS carries those natively, so the compile check runs there
    # (the promise the test job's comment used to make without a job).
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./cmd/which-model-desktop

  desktop-frontend:
    # The web frontends (packages/*, apps/desktop) had zero CI: vitest and
    # tsc regressions were only caught locally. Run typecheck + tests here.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Corepack honors the repository's packageManager pin (pnpm@11.5.0)
      # instead of a mutable @latest, keeping this gate reproducible.
      - run: corepack enable && corepack prepare pnpm@11.5.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @which-model/core build
      - run: pnpm --filter @which-model/ui build
      - run: pnpm -r typecheck
      - run: pnpm -r test