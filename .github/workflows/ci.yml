name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on:
      group: WDM-Small
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true
      # The Wails desktop app (cmd/which-model-desktop) needs GTK/webkitgtk
      # to compile on Linux. The CLI and its libraries are verified here;
      # desktop Linux build is verified on macOS or in a dedicated job.
      - run: go build ./cmd/which-model ./internal/... ./pkg/...
      - run: go vet ./cmd/which-model ./internal/... ./pkg/...
      - run: go test ./cmd/which-model ./internal/... ./pkg/...
      - name: nousage audit (build matrix + strings scan)
        if: hashFiles('scripts/audit-nousage.sh') != ''
        run: bash scripts/audit-nousage.sh

  npm-smoke:
    runs-on:
      group: WDM-Small
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Smoke-test npm packaging
        run: bash scripts/smoke-npm.sh npm