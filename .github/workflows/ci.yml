name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tracked-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/check_tracked_paths.py

  windows-cli:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # A real checkout catches path failures that Linux cross-compilation cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/check_tracked_paths.py
      - run: go build -o which-model.exe ./cmd/which-model
      - run: go build -tags nousage -o which-model-nousage.exe ./cmd/which-model
      - name: Smoke-test both CLI variants
        shell: bash
        run: |
          set -euo pipefail
          ./which-model.exe version --json
          ./which-model.exe --help
          ./which-model-nousage.exe version --json
          ./which-model-nousage.exe --help

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The Wails desktop app (cmd/which-model-desktop) needs GTK/webkitgtk
      # to compile on Linux, so it is NOT built here; the desktop-backend job
      # below builds it on macOS. The CLI and its libraries are verified here.
      - run: go build ./cmd/which-model ./internal/... ./pkg/...
      - run: go vet ./cmd/which-model ./internal/... ./pkg/...
      - run: go test ./cmd/which-model ./internal/... ./pkg/...
      - name: nousage audit (build matrix + strings scan)
        if: hashFiles('scripts/audit-nousage.sh') != ''
        run: bash scripts/audit-nousage.sh

  python-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The hosted image supplies Python; fail explicitly below 3.11.
      - run: python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
      - run: python3 -m unittest discover -s .daily-update/tests -v

  npm-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node --test npm/which-model/*.test.js
      - name: Smoke-test npm packaging
        run: bash scripts/smoke-npm.sh npm

  release-verifier:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --test npm/which-model/install.test.js npm/which-model/verify-release.test.js

  score-only:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Audit restricted command and linked capabilities
        shell: bash
        run: bash scripts/audit-score-only.sh
      - name: Trace ranking with network denied
        if: runner.os == 'Linux'
        run: |
          CGO_ENABLED=0 go build -tags nousage -o /tmp/which-model-score-only ./cmd/which-model-score-only
          sudo apt-get update -qq
          sudo apt-get install -y strace
          sudo unshare --net -- python3 scripts/score_only_smoke.py --trace /tmp/which-model-score-only

  secure-credentials:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      WHICH_MODEL_NATIVE_STORE_TEST: '1'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native Linux fixture services
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dbus gnome-keyring
      - run: go test ./internal/securestore -v -count=1
      - run: go test ./internal/usage/credential -run 'TestNative|TestCompanyCredentialFallbackHasNoFileSideEffects' -v
      - run: go test ./internal/config -run TestNativeWindows -v

  company-policy:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./internal/company
      # Existing general config/credential suites contain POSIX-only permission
      # and path assertions. Run the complete new policy matrix natively here;
      # the test job still runs the full suites on Linux.
      - run: go test ./internal/config -run 'TestManagedConfigurationPrecedence|TestManagedStorageAndDesktopMutation|TestRequiredPolicyPrecedesOrdinaryConfigReads|TestManagedRankingPreferencesRemainAvailable'
      - run: go test ./internal/usage/credential -run TestCompanyCredentialFallbackHasNoFileSideEffects
      - run: go build -o company-policy-cli.exe ./cmd/which-model
      - name: Provision native ownership and ACL fixtures
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python scripts/company_policy_fixture.py prepare --github-env "$GITHUB_ENV"
          else
            sudo env GITHUB_ACTIONS=true python3 scripts/company_policy_fixture.py prepare --github-env "$GITHUB_ENV"
          fi
      - name: Inspect native fixture ACLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'C:\', 'C:\ProgramData', 'C:\ProgramData\which-model-company-ci', 'C:\ProgramData\which-model-company-ci\valid', 'C:\ProgramData\which-model-company-ci\valid\required.json' | ForEach-Object {
            $policyAcl = Get-Acl -LiteralPath $_
            Write-Output "$_ $($policyAcl.Sddl)"
          }
      - name: Exercise actual protected enrollment and operation boundaries
        run: go test ./internal/company -run TestNative -v
      - name: Verify CLI authority and required-policy behavior
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python scripts/company_policy_fixture.py probe --binary company-policy-cli.exe
          else
            sudo env GITHUB_ACTIONS=true python3 scripts/company_policy_fixture.py probe --binary company-policy-cli.exe
          fi
      - name: Remove only owned CI enrollment fixtures
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python scripts/company_policy_fixture.py cleanup
          else
            sudo env GITHUB_ACTIONS=true python3 scripts/company_policy_fixture.py cleanup
          fi

  desktop-backend:
    # The Wails desktop backend needs CGO + the GTK/webkitgtk toolchain on
    # Linux; macOS carries those natively, so the compile check runs there
    # (the promise the test job's comment used to make without a job).
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./cmd/which-model-desktop

  desktop-frontend:
    # The web frontends (packages/*, apps/desktop) had zero CI: vitest and
    # tsc regressions were only caught locally. Run typecheck + tests here.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Corepack honors the repository's packageManager pin (pnpm@11.5.0)
      # instead of a mutable @latest, keeping this gate reproducible.
      - run: corepack enable && corepack prepare pnpm@11.5.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @which-model/core build
      - run: pnpm --filter @which-model/ui build
      - run: pnpm -r typecheck
      - run: pnpm -r test
