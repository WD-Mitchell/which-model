name: npm-release
on:
  push:
    tags: ["v*"]
  # A manual run creates the requested tag only after tests and builds pass,
  # then publishes the release in the same run. This avoids publishing an
  # assetless draft merely to create its tag, which immutable releases lock.
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example, v2.4.1)
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
concurrency:
  group: npm-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            printf 'Invalid release tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The release ships the CLI (cmd/which-model + its libraries). The Wails
      # desktop app (cmd/which-model-desktop) is macOS-primary and needs the
      # full GTK/webkitgtk Linux toolchain to compile, so it is intentionally
      # out of this CLI-release gate; its Linux build is verified separately.
      - run: go build ./cmd/which-model ./internal/... ./pkg/...
      - run: go vet ./cmd/which-model ./internal/... ./pkg/...
      - run: go test ./cmd/which-model ./internal/... ./pkg/...
      # The release gate is the last line of defense for F21 SPEC §2.2/§5 R5
      # (both build variants verified before anything ships) — mirror ci.yml's
      # nousage audit: nousage build + strings scan + compiled-out tests.
      - name: nousage audit (build matrix + strings scan)
        if: hashFiles('scripts/audit-nousage.sh') != ''
        run: bash scripts/audit-nousage.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release binaries
        run: bash scripts/build-release.sh "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create release tag for manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" 2>/dev/null; then
            existing_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$existing_commit" != "$GITHUB_SHA" ]; then
              printf 'Tag %s already points to %s, not %s\n' \
                "$RELEASE_TAG" "$existing_commit" "$GITHUB_SHA" >&2
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Create immutable release and upload bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$release_is_draft" = "false" ]; then
            release_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
            missing_assets=()
            for asset in dist/*; do
              asset_name="${asset##*/}"
              if ! printf '%s\n' "$release_assets" | grep -Fxq "$asset_name"; then
                missing_assets+=("$asset_name")
              fi
            done
            if [ "${#missing_assets[@]}" -ne 0 ]; then
              printf 'Release %s is immutable and missing assets: %s\n' \
                "$RELEASE_TAG" "${missing_assets[*]}" >&2
              printf 'Publish a new version tag; immutable release assets cannot be repaired.\n' >&2
              exit 1
            fi
            echo "Release $RELEASE_TAG is already published with all expected assets."
            exit 0
          fi
          if [ -z "$release_is_draft" ]; then
            gh release create "$RELEASE_TAG" --draft --generate-notes --verify-tag
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          # Prerelease tags (contain '-') get the prerelease flag and do NOT
          # become "Latest"; stable releases do.
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
      # The Publish environment only admits v* tags. A manual branch run
      # creates the release, then queues the idempotent npm phase at that tag.
      - name: Continue npm publish from release tag
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run npm-release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" -f version="$RELEASE_TAG"

  publish:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Publish
    permissions:
      contents: read
      # OIDC token for npm Trusted Publishing — no long-lived token needed.
      # Configure the trusted publisher once on npmjs.com for each of the six
      # packages (@wdm-uk/which-model + the five platform packages):
      #   Provider: GitHub Actions
      #   Organization: WD-Mitchell
      #   Repository: which-model
      #   Workflow filename: npm-release.yml
      #   Environment name: Publish
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Place binaries into platform packages
        run: |
          cp dist/which-model-darwin-arm64      npm/which-model-darwin-arm64/which-model
          cp dist/which-model-darwin-x64        npm/which-model-darwin-x64/which-model
          cp dist/which-model-linux-arm64       npm/which-model-linux-arm64/which-model
          cp dist/which-model-linux-x64         npm/which-model-linux-x64/which-model
          cp dist/which-model-windows-x64.exe   npm/which-model-windows-x64/which-model.exe
          chmod +x npm/which-model-darwin-arm64/which-model npm/which-model-darwin-x64/which-model npm/which-model-linux-arm64/which-model npm/which-model-linux-x64/which-model
      - name: Stamp versions
        run: node npm/scripts/sync-version.js "${RELEASE_TAG#v}"
      - name: Publish (npm Trusted Publishing)
        run: |
          # OIDC-capable npm is required for tokenless publishing.
          npm install -g npm@latest
          if [ -n "$NPM_TOKEN" ]; then
            # Escape hatch for manual re-runs without trusted publishing.
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> "$HOME/.npmrc"
          fi
          node npm/scripts/publish.js
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
