# GENERATED by `which-model catalog workflow --write` from [catalog.publish] — do not hand-edit.
name: refresh-model-data
on:
  schedule:
    - cron: "0 6 * * *" # Europe/London, per [catalog.publish].schedule
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: refresh-model-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on:
      group: WDM-Small
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        branch: ["main"] # from [catalog.publish].branches, listed order
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o which-model ./cmd/which-model
      - run: go test ./internal/catalog/... ./internal/pick/... ./internal/routing/...
      - run: ./which-model catalog refresh
        env:
          ARTIFICIAL_ANALYSIS_API: ${{ secrets.ARTIFICIAL_ANALYSIS_API }}
      - id: changes
        run: |
          git add -- available_model_raw_values.csv available_model_scores.csv
          git diff --cached --quiet || echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.changed == 'true'
        run: |
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(data): refresh available model scores"
      - if: steps.changes.outputs.changed == 'true'
        run: >-
          gh pr create --base "${{ matrix.branch }}" --title "chore(data): refresh available model scores" --label data --label automated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.changes.outputs.changed == 'true'
        run: gh pr merge --auto --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report per-branch outcome
        if: always()
        run: |
          if [ "${{ steps.changes.outcome }}" = "success" ] && [ "${{ steps.changes.outputs.changed }}" != "true" ]; then
            echo "refresh branch ${{ matrix.branch }}: skipped-no-changes" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.changes.outcome }}" = "success" ]; then
            echo "refresh branch ${{ matrix.branch }}: published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "refresh branch ${{ matrix.branch }}: failed" >> "$GITHUB_STEP_SUMMARY"
          fi
