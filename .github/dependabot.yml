# Dependabot version updates. The scaffold placeholder
# (`package-ecosystem: ""`) was invalid and disabled updates entirely
# (issue #44); declare each ecosystem the repo actually carries.
version: 2
updates:
  # Go module (CLI + libraries + desktop backend).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
  # pnpm workspace (packages/*, apps/desktop, npm/* platform packages).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  # GitHub Actions workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Daily-update pipeline scripts (.daily-update/, Python stdlib only —
  # no requirements.txt exists, so this entry is intentionally omitted
  # until a manifest lands; see the issue discussion).
