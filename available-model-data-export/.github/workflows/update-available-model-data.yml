name: Update Available Model Data

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-available-model-data-main
  cancel-in-progress: false

jobs:
  update:
    name: Refresh model data
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Discover models.dev catalogue and refresh raw benchmark data
        env:
          ARTIFICIAL_ANALYSIS_API: ${{ secrets.ARTIFICIAL_ANALYSIS_API }}
        run: python3 .github/workflows/update_available_model_data/update_raw_values.py

      - name: Generate normalized model scores
        run: python3 .github/workflows/update_available_model_data/generate_scores.py

      - name: Run full test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v

      - name: Stage generated model data
        id: changes
        run: |
          git add -- available_model_raw_values.csv .centree-agentic-framework/available_model_scores.csv
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Generated model data is already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Generated model data changed and will be committed."
          fi

      - name: Commit generated model data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh available model scores"

      - name: Push generated model data to main
        if: steps.changes.outputs.changed == 'true'
        run: git push origin HEAD:main
